[workspace]
members = [
    "crates/deterministic-protocol",
    "crates/deterministic-core",
    "crates/deterministic-daemon",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false }
chrono = "0.4.43"
globset = "0.4"
http = "1.3.1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = "1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = "1"
walkdir = "2"

# Dummy root package so this is a real (not virtual) manifest —
# required for [[bin]] and [[test]] tables at workspace level.
# The actual binary is in crates/deterministic-daemon/src/main.rs.
[package]
name = "chatcodex"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ChatCodex — deterministic coding harness for ChatGPT"