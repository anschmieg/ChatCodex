[package]
name = "codex-native-harness-mcp-auth"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_native_harness_mcp_auth"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
askama = "0.15.4"
axum = { workspace = true, features = ["form", "http1", "json", "query", "tokio"] }
base64 = { workspace = true }
rand = { workspace = true }
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true, features = ["formatting", "macros"] }
rsa = { version = "0.9", features = ["sha2"] }
pkcs8 = { version = "0.10", features = ["pem", "alloc"] }
spki = { version = "0.7", features = ["pem"] }
pem = "3"
signature = { version = "2", features = ["std"] }
serde_urlencoded = "0.7"
http-body-util = "0.1.3"
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-std", "macros", "net", "rt-multi-thread"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
urlencoding = { workspace = true }
