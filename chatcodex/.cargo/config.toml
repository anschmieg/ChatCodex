[build]
jobs = 4
rustc-wrapper = "sccache"
target-dir = "/home/t3/.cache/codex-rs/chatcodex-target"

# GCC as linker driver with LLD — LLD is ~5× faster than BFD ld on aarch64
# -fuse-ld=lld tells GCC to use LLD instead of the system BFD ld
# -B add a search path so GCC can find our ld.lld symlink (from rustup)
[target.aarch64-unknown-linux-gnu]
linker = "/usr/bin/aarch64-linux-gnu-gcc"
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
    "-C", "link-arg=-B/home/t3/.local/bin",
]
