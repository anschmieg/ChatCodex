[package]
name = "chatcodex-oauth"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "chatcodex_oauth"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
askama = "0.15.4"
axum = { workspace = true, features = ["form", "http1", "json", "query", "tokio"] }
base64 = { workspace = true }
rand = { workspace = true }
rand_core = { workspace = true, features = ["getrandom"] }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true, features = ["formatting", "macros"] }
rsa = { workspace = true, features = ["sha2"] }
pkcs8 = { workspace = true, features = ["pem", "alloc"] }
spki = { workspace = true, features = ["pem"] }
pem = { workspace = true }
signature = { workspace = true, features = ["std"] }
serde_urlencoded = { workspace = true }
http-body-util = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tower = { workspace = true, default-features = false, features = ["util"] }
tower-http = { workspace = true, features = ["trace"] }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-std", "macros", "net", "rt-multi-thread"] }
tower = { workspace = true, default-features = false, features = ["util"] }
urlencoding = { workspace = true }
