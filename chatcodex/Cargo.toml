[workspace]
members = [
    "crates/mcp-server",
    "crates/oauth",
]
resolver = "2"

# Fast dev builds: trade some runtime perf and debug info for <2 min compilation
[profile.dev]
opt-level = 1          # Skip -O0; still fast to compile, but ~10x runtime perf for tests
debug = 1              # Line tables only (saves 30-50% compile time over full debug info)
codegen-units = 256    # Maximise parallelism across 4 cores
incremental = true     # Default, explicit for clarity

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
shlex = "2"
# External
anyhow = "1"
axum = { version = "0.8", default-features = false }
axum-prometheus = "0.10.0"
base64 = "0.22.1"
http = "1.3.1"
http-body-util = "0.1.3"
mime_guess = "2.0.5"
rand = "0.9"
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "0.12", features = ["cookies", "json", "rustls-tls"] }
rmcp = { version = "1.7.0", default-features = false, features = [
    "server",
    "transport-streamable-http-server",
] }
url = "2"
rsa = { version = "0.9", features = ["sha2"] }
pkcs8 = { version = "0.10", features = ["pem", "alloc"] }
spki = { version = "0.7", features = ["pem"] }
pem = "3"
signature = { version = "2", features = ["std"] }
serde = "1"
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
time = { version = "0.3.47", features = ["formatting", "macros"] }
tokio = { version = "1", features = [
    "io-std",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
urlencoding = "2.1"
uuid = { version = "1", features = ["v4"] }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }

# Dev dependencies
reqwest-dev = { package = "reqwest", version = "0.12", features = ["json", "rustls-tls"] }
tempfile = "3.23.0"

[workspace.lints]
rust = {}

[workspace.lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
expect_used = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"
unwrap_used = "deny"

[patch.crates-io]
crossterm = { git = "https://github.com/nornagon/crossterm", rev = "87db8bfa6dc99427fd3b071681b07fc31c6ce995" }
ratatui = { git = "https://github.com/nornagon/ratatui", rev = "9b2ad1298408c45918ee9f8241a6f95498cdbed2" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "132f5b39c862e3a970f731d709608b3e6276d5f6" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }
