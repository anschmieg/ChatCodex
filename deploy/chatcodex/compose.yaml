services:
  chatcodex:
    image: ${CHATCODEX_IMAGE:-ghcr.io/anschmieg/chatcodex:latest}
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${CHATCODEX_PIDS_LIMIT:-512}
    mem_limit: ${CHATCODEX_MEMORY_LIMIT:-4g}
    cpus: ${CHATCODEX_CPU_LIMIT:-2}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=1777
    volumes:
      - type: bind
        source: ${CHATCODEX_WORKSPACE_BASE:?set CHATCODEX_WORKSPACE_BASE}
        target: /workspaces
      # Optional: mount SSH keys for cloning private repositories.
      # - type: bind
      #   source: ${HOME}/.ssh
      #   target: /toolchains/home/chatcodex/.ssh
      #   read_only: true
      # Optional: mount a git credentials helper or netrc for HTTPS private repos.
      # - type: bind
      #   source: ${HOME}/.git-credentials
      #   target: /toolchains/home/chatcodex/.git-credentials
      #   read_only: true
      - type: volume
        source: chatcodex-toolchains
        target: /toolchains
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  chatcodex-toolchains:
