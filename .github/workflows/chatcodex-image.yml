name: chatcodex-image

on:
  push:
    branches:
      - codex/workspace-migration
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA or branch to build (default: HEAD)"
        required: false
        type: string
      force_redeploy:
        description: "Trigger a Coolify redeploy after the image lands"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/anschmieg/chatcodex
  COOLIFY_DEPLOY_TIMEOUT_SECS: "1500"

jobs:
  build-and-deploy:
    name: Build, push and deploy ChatCodex
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      # Resolve ref with smart checkout depth
      # On push events GITHUB_SHA is the commit, so we only need depth 1.
      # On workflow_dispatch with a custom sha we need full history to resolve it.
      - name: Checkout (shallow for push, full for manual sha)
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.sha != '' && 0 || 1 }}

      - name: Resolve SHA, short SHA, and tags
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          input_sha="${{ inputs.sha }}"
          if [[ -n "${input_sha}" ]]; then
            sha="$(git rev-parse "${input_sha}")"
            short="$(git rev-parse --short "${input_sha}")"
            base_ref="${input_sha}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            sha="${{ github.sha }}"
            short="${{ github.sha }}"
            short="$(git rev-parse --short "${sha}")"
            base_ref="${GITHUB_REF_NAME}"
          else
            sha="$(git rev-parse HEAD)"
            short="$(git rev-parse --short HEAD)"
            base_ref="${GITHUB_REF_NAME}"
          fi
          branch_tag="$(printf '%s' "${base_ref}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//; s/-+/./g')"
          branch_tag="branch-${branch_tag}"
          {
            echo "sha=${sha}"
            echo "short=${short}"
            echo "image_tag=${short}"
            echo "branch_tag=${branch_tag}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved ${sha} (${short}) for ref '${base_ref}'; image_tag=${short}; branch_tag=${branch_tag}" >&2

      # Build Docker image
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push with native ARM64 + registry cache
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/chatcodex/Dockerfile
          build-contexts: |
            chatcodex-mcp=./chatcodex/crates/mcp-server
            chatcodex-oauth=./chatcodex/crates/oauth
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.resolve.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.resolve.outputs.branch_tag }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=chatcodex
            org.opencontainers.image.source=https://github.com/anschmieg/ChatCodex
            org.opencontainers.image.revision=${{ steps.resolve.outputs.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
          cache-from: |
            type=registry,ref=ghcr.io/anschmieg/chatcodex:build-cache-branch-${{ steps.resolve.outputs.branch_tag }}
            type=registry,ref=ghcr.io/anschmieg/chatcodex:latest
          cache-to: |
            type=registry,ref=ghcr.io/anschmieg/chatcodex:build-cache-branch-${{ steps.resolve.outputs.branch_tag }},mode=max
          provenance: false
          sbom: false

      - name: Verify the image is pullable
        shell: bash
        run: |
          set -euo pipefail
          ANON_TOKEN="$(curl -fsSL 'https://ghcr.io/token?scope=repository:anschmieg/chatcodex:pull&service=ghcr.io' | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')"
          curl -fsSL \
            -H "Authorization: Bearer ${ANON_TOKEN}" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/anschmieg/chatcodex/manifests/${{ steps.resolve.outputs.image_tag }}" \
            | head -c 400 >&2
          echo >&2

      # Deploy to Coolify (conditional)
      - name: Validate deploy inputs
        if: ${{ inputs.force_redeploy != false || github.event_name == 'push' }}
        shell: bash
        env:
          API_BASE: ${{ secrets.COOLIFY_API_BASE_URL }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          if [[ -z "${API_BASE}" ]]; then
            echo "::error::COOLIFY_API_BASE_URL is not set" >&2
            exit 1
          fi
          if [[ -z "${API_TOKEN}" ]]; then
            echo "::error::COOLIFY_API_TOKEN is not set" >&2
            exit 1
          fi
          if [[ -z "${APP_UUID}" ]]; then
            echo "::error::COOLIFY_APP_UUID is not set" >&2
            exit 1
          fi
          echo "Deploy inputs validated" >&2

      - name: Ensure persistent toolchain storage
        if: ${{ inputs.force_redeploy != false || github.event_name == 'push' }}
        shell: bash
        env:
          API_BASE: ${{ secrets.COOLIFY_API_BASE_URL }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          storages_url="${API_BASE}/applications/${APP_UUID}/storages"
          http_code=$(curl -sS -o /tmp/coolify-storages.json -w "%{http_code}" \
            -H "Authorization: Bearer ${API_TOKEN}" \
            -H "Accept: application/json" \
            "${storages_url}")
          echo "GET /applications/${APP_UUID}/storages -> ${http_code}" >&2
          if [[ "${http_code}" -lt 200 || "${http_code}" -ge 300 ]]; then
            cat /tmp/coolify-storages.json >&2
            echo >&2
            echo "::error::Could not inspect Coolify application storage" >&2
            exit 1
          fi

          storage_state=$(python3 - <<'PY'
          import json
          with open("/tmp/coolify-storages.json", encoding="utf-8") as handle:
              storages = json.load(handle)
          persistent = [
              s for s in storages.get("persistent_storages", [])
              if s.get("mount_path") == "/toolchains"
          ]
          files = [
              s for s in storages.get("file_storages", [])
              if s.get("mount_path") == "/toolchains"
          ]
          forbidden_data = [
              s for storage_type in ("persistent_storages", "file_storages")
              for s in storages.get(storage_type, [])
              if s.get("mount_path") == "/data"
          ]
          if forbidden_data:
              print("forbidden-data")
          elif files:
              print("conflict")
          elif persistent:
              print("exists")
          else:
              print("missing")
          PY
          )

          case "${storage_state}" in
            forbidden-data)
              echo "::error::A host storage is mounted at /data; remove it before deploying" >&2
              exit 1
              ;;
            exists)
              echo "Persistent /toolchains storage already exists." >&2
              ;;
            conflict)
              echo "::error::A file storage already occupies /toolchains; refusing to replace it" >&2
              exit 1
              ;;
            missing)
              payload='{"type":"persistent","name":"chatcodex-toolchains","mount_path":"/toolchains"}'
              http_code=$(curl -sS -o /tmp/coolify-storage-create.json -w "%{http_code}" \
                -X POST \
                -H "Authorization: Bearer ${API_TOKEN}" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json" \
                --data-binary "${payload}" \
                "${storages_url}")
              echo "POST /applications/${APP_UUID}/storages -> ${http_code}" >&2
              cat /tmp/coolify-storage-create.json >&2
              echo >&2
              if [[ "${http_code}" -lt 200 || "${http_code}" -ge 300 ]]; then
                echo "::error::Coolify rejected the /toolchains storage creation" >&2
                exit 1
              fi
              ;;
            *)
              echo "::error::Unexpected storage inspection result: ${storage_state}" >&2
              exit 1
              ;;
          esac

      - name: Re-point Coolify at the freshly built image tag
        if: ${{ inputs.force_redeploy != false || github.event_name == 'push' }}
        shell: bash
        env:
          API_BASE: ${{ secrets.COOLIFY_API_BASE_URL }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          if [[ -z "${API_BASE}" || -z "${API_TOKEN}" || -z "${APP_UUID}" ]]; then
            echo "::error::COOLIFY_API_BASE_URL / COOLIFY_API_TOKEN / COOLIFY_APP_UUID must be set" >&2
            exit 1
          fi
          payload=$(cat <<JSON
          {
            "docker_registry_image_name": "ghcr.io/anschmieg/chatcodex",
            "docker_registry_image_tag":  "${{ steps.resolve.outputs.image_tag }}",
            "custom_docker_run_options": "--cap-drop=ALL",
            "limits_memory": "4g",
            "limits_memory_swap": "4g",
            "limits_cpus": "2"
          }
          JSON
          )
          http_code=$(curl -sS -o /tmp/coolify-patch.json -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: Bearer ${API_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data-binary "${payload}" \
            "${API_BASE}/applications/${APP_UUID}")
          echo "PATCH /applications/${APP_UUID} -> ${http_code}" >&2
          cat /tmp/coolify-patch.json >&2
          echo >&2
          if [[ "${http_code}" -lt 200 || "${http_code}" -ge 300 ]]; then
            echo "::error::Coolify rejected the image-tag PATCH" >&2
            exit 1
          fi

      - name: Trigger Coolify deploy via API
        if: ${{ inputs.force_redeploy != false || github.event_name == 'push' }}
        shell: bash
        env:
          API_BASE: ${{ secrets.COOLIFY_API_BASE_URL }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          http_code=$(curl -sS -o /tmp/coolify-trigger.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${API_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data-binary "" \
            "${API_BASE}/deploy?uuid=${APP_UUID}&force=false")
          echo "POST /deploy -> ${http_code}" >&2
          cat /tmp/coolify-trigger.json >&2
          echo >&2
          if [[ "${http_code}" -lt 200 || "${http_code}" -ge 300 ]]; then
            echo "::error::Coolify deploy API returned ${http_code}" >&2
            exit 1
          fi
          python3 -c "
          import json, sys
          d = json.load(open('/tmp/coolify-trigger.json'))
          du = d.get('deployments', [{}])[0].get('deployment_uuid')
          if not du:
              print('::error::No deployment_uuid in response', file=sys.stderr)
              sys.exit(1)
          open('/tmp/coolify-deployment-uuid','w').write(du)
          print('Deployment UUID:', du, file=sys.stderr)
          "

      - name: Poll the deployment to completion (5s intervals)
        if: ${{ inputs.force_redeploy != false || github.event_name == 'push' }}
        env:
          API_BASE: ${{ secrets.COOLIFY_API_BASE_URL }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -euo pipefail
          du="$(cat /tmp/coolify-deployment-uuid)"
          echo "Polling deployment ${du} every 5s for up to ${COOLIFY_DEPLOY_TIMEOUT_SECS}s" >&2
          end=$(( $(date +%s) + COOLIFY_DEPLOY_TIMEOUT_SECS ))
          status="queued"
          while (( $(date +%s) < end )); do
            body="$(curl -fsSL \
              -H "Authorization: Bearer ${API_TOKEN}" \
              -H "Accept: application/json" \
              "${API_BASE}/deployments/${du}")"
            status="$(printf '%s' "${body}" | python3 -c "import sys, json; print(json.load(sys.stdin).get('status','unknown'))")"
            echo "[$(date -u +%H:%M:%SZ)] deployment status: ${status}" >&2
            case "${status}" in
              finished|success)
                echo "Deployment finished." >&2
                exit 0
                ;;
              failed|cancelled|error)
                echo "::error::Deployment ended in status '${status}'. Tail of logs:" >&2
                printf '%s' "${body}" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          logs = d.get('logs','') or ''
          try:
              parsed = json.loads(logs)
              if isinstance(parsed, list):
                  tail = '\n'.join((e.get('output') or '').replace('\\n','\n') for e in parsed[-25:])
                  print(tail, file=sys.stderr)
              else:
                  print(logs[-3000:], file=sys.stderr)
          except Exception:
              print(logs[-3000:], file=sys.stderr)
          """
                exit 1
                ;;
              *)
                sleep 5
                ;;
            esac
          done
          echo "::error::Timed out waiting for deployment ${du} (last status: ${status})" >&2
          exit 1
