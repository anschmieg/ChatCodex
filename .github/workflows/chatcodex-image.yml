name: chatcodex-image

# Build the ChatCodex deployment image in CI and trigger a Coolify redeploy.
#
# This workflow exists because the Coolify production node OOMs while
# compiling the `codex-native-harness-mcp-auth` closure graph. Building the
# image on GitHub-hosted runners (16 GiB x86_64) and shipping a prebuilt
# `ghcr.io/anschmieg/chatcodex:<sha>` to the Coolify "Docker Image" build
# pack avoids the builder memory cliff entirely.
#
# Required secrets:
#   COOLIFY_DEPLOY_WEBHOOK_URL — full URL of the manual GitHub webhook on the
#       Coolify application, including the `?uuid=...&force=...` query
#       parameters. The webhook secret is the app's
#       `manual_webhook_secret_github`; the workflow signs the body with
#       HMAC-SHA1 and sets `X-Hub-Signature: sha1=...` to match Coolify.
#   COOLIFY_WEBHOOK_SECRET     — the matching `manual_webhook_secret_github`
#       value (see `GET /applications/{uuid}` on the Coolify host).
#   COOLIFY_API_BASE_URL       — e.g. `https://panel.nothing.pink/api/v1`
#   COOLIFY_API_TOKEN          — bearer token with read+write on the app,
#       used to point the app at the freshly built `<sha>` tag and to poll
#       the resulting deployment's status.
#   COOLIFY_APP_UUID           — `okgs4ck888w0ws48wow48co8` for the
#       production ChatCodex app.
#
# Tags produced:
#   ghcr.io/anschmieg/chatcodex:<short-sha>  — immutable reference
#   ghcr.io/anschmieg/chatcodex:branch-<sanitized-branch>
#   ghcr.io/anschmieg/chatcodex:latest
#
# Architecture:
#   The Coolify production node is aarch64 (build logs show
#   `1.93.0-aarch64-unknown-linux-gnu`). We cross-build arm64 with
#   BuildKit + qemu on the GitHub-hosted `ubuntu-24.04` runner. Add
#   linux/amd64 to PLATFORMS when an x86_64 host needs to deploy.
#
# To run manually:
#   gh workflow run chatcodex-image.yml -f sha=<git-sha-or-branch>
#   or
#   gh workflow run chatcodex-image.yml        # uses HEAD

on:
  push:
    branches:
      - codex/native-harness-mcp
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA or branch to build (default: HEAD)"
        required: false
        type: string
      force_redeploy:
        description: "Trigger a Coolify redeploy after the image lands"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/anschmieg/chatcodex
  PLATFORMS: linux/arm64
  COOLIFY_DEPLOY_TIMEOUT_SECS: "1500"

jobs:
  resolve-ref:
    name: Resolve ref and compute image tag
    runs-on: ubuntu-24.04
    outputs:
      resolved_sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      branch_tag: ${{ steps.resolve.outputs.branch_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve SHA, short SHA, and tags
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          input_sha="${{ inputs.sha }}"
          if [[ -n "${input_sha}" ]]; then
            sha="$(git rev-parse "${input_sha}")"
            short="$(git rev-parse --short "${sha}")"
            base_ref="${input_sha}"
          else
            sha="$(git rev-parse HEAD)"
            short="$(git rev-parse --short HEAD)"
            base_ref="${GITHUB_REF_NAME}"
          fi
          branch_tag="$(printf '%s' "${base_ref}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//; s/-+/./g')"
          branch_tag="branch-${branch_tag}"
          {
            echo "sha=${sha}"
            echo "short=${short}"
            echo "image_tag=${short}"
            echo "branch_tag=${branch_tag}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved ${sha} (${short}) for ref '${base_ref}'; image_tag=${short}; branch_tag=${branch_tag}" >&2

  build:
    name: Build and push image
    needs: resolve-ref
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute cache-from digest for the parent commit
        id: cache
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse "${{ needs.resolve-ref.outputs.resolved_sha }}^" 2>/dev/null || true)"
          if [[ -n "${parent}" ]]; then
            if curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
                "https://ghcr.io/v2/anschmieg/chatcodex/manifests/${parent}" >/dev/null 2>&1; then
              echo "value=type=registry,ref=ghcr.io/anschmieg/chatcodex:${parent}" >> "$GITHUB_OUTPUT"
              echo "Parent image is present in GHCR; using it as cache source" >&2
            else
              echo "value=type=gha" >> "$GITHUB_OUTPUT"
              echo "Parent image not yet in GHCR; falling back to GHA cache" >&2
            fi
          else
            echo "value=type=gha" >> "$GITHUB_OUTPUT"
            echo "No parent SHA (initial push); using GHA cache" >&2
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/chatcodex/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.resolve-ref.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:${{ needs.resolve-ref.outputs.branch_tag }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=chatcodex
            org.opencontainers.image.source=https://github.com/anschmieg/ChatCodex
            org.opencontainers.image.revision=${{ needs.resolve-ref.outputs.resolved_sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
          cache-from: ${{ steps.cache.outputs.value }}
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Verify the image is pullable
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/anschmieg/chatcodex/manifests/${{ needs.resolve-ref.outputs.image_tag }}" \
            | head -c 400 >&2
          echo >&2

  deploy:
    name: Trigger Coolify redeploy and poll to completion
    needs: [resolve-ref, build]
    if: ${{ inputs.force_redeploy != false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE_TAG: ${{ needs.resolve-ref.outputs.image_tag }}
    steps:
      - name: Validate webhook inputs
        id: sign
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.COOLIFY_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${WEBHOOK_URL}" ]]; then
            echo "::error::COOLIFY_DEPLOY_WEBHOOK_URL is not set" >&2
            exit 1
          fi
          if [[ -z "${WEBHOOK_SECRET}" ]]; then
            echo "::error::COOLIFY_WEBHOOK_SECRET is not set" >&2
            exit 1
          fi
          # Empty body, identical to what GitHub itself would post. Coolify
          # expects X-Hub-Signature: sha1=<hex(hmac_sha1(secret, body))>.
          sig="sha1=$(printf '' | openssl dgst -sha1 -hmac "${WEBHOOK_SECRET}" -binary | xxd -p -c 256)"
          {
            echo "signature=${sig}"
            echo "url=${WEBHOOK_URL}"
          } >> "$GITHUB_OUTPUT"

      - name: Re-point Coolify at the freshly built image tag and flip build_pack once
        shell: bash
        env:
          API_BASE: ${{ secrets.COOLIFY_API_BASE_URL }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          if [[ -z "${API_BASE}" || -z "${API_TOKEN}" || -z "${APP_UUID}" ]]; then
            echo "::error::COOLIFY_API_BASE_URL / COOLIFY_API_TOKEN / COOLIFY_APP_UUID must be set" >&2
            exit 1
          fi
          # One-time build_pack flip (idempotent; Coolify accepts the same value)
          payload=$(cat <<JSON
          {
            "build_pack": "dockerimage",
            "docker_registry_image_name": "ghcr.io/anschmieg/chatcodex",
            "docker_registry_image_tag":  "${IMAGE_TAG}",
            "static_image":                "ghcr.io/anschmieg/chatcodex:${IMAGE_TAG}"
          }
          JSON
          )
          http_code=$(curl -sS -o /tmp/coolify-patch.json -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: Bearer ${API_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data-binary "${payload}" \
            "${API_BASE}/applications/${APP_UUID}")
          echo "PATCH /applications/${APP_UUID} -> ${http_code}" >&2
          cat /tmp/coolify-patch.json >&2
          echo >&2
          if [[ "${http_code}" -lt 200 || "${http_code}" -ge 300 ]]; then
            echo "::error::Coolify rejected the image-tag PATCH" >&2
            exit 1
          fi

      - name: Hit the Coolify deploy webhook
        shell: bash
        env:
          WEBHOOK_URL: ${{ steps.sign.outputs.url }}
          SIGNATURE:   ${{ steps.sign.outputs.signature }}
        run: |
          set -euo pipefail
          http_code=$(curl -sS -o /tmp/coolify-trigger.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature: ${SIGNATURE}" \
            -H "X-GitHub-Event: push" \
            --data-binary "" \
            "${WEBHOOK_URL}")
          echo "POST webhook -> ${http_code}" >&2
          cat /tmp/coolify-trigger.json >&2
          echo >&2
          if [[ "${http_code}" -lt 200 || "${http_code}" -ge 300 ]]; then
            echo "::error::Coolify deploy webhook returned ${http_code}" >&2
            exit 1
          fi
          python3 -c "
          import json, sys
          d = json.load(open('/tmp/coolify-trigger.json'))
          du = d.get('deployments', [{}])[0].get('deployment_uuid')
          if not du:
              print('::error::No deployment_uuid in response', file=sys.stderr)
              sys.exit(1)
          open('/tmp/coolify-deployment-uuid','w').write(du)
          print('Deployment UUID:', du, file=sys.stderr)
          "

      - name: Poll the deployment to completion
        env:
          API_BASE: ${{ secrets.COOLIFY_API_BASE_URL }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -euo pipefail
          du="$(cat /tmp/coolify-deployment-uuid)"
          echo "Polling deployment ${du} every 10s for up to ${COOLIFY_DEPLOY_TIMEOUT_SECS}s" >&2
          end=$(( $(date +%s) + COOLIFY_DEPLOY_TIMEOUT_SECS ))
          status="queued"
          while (( $(date +%s) < end )); do
            body="$(curl -fsSL \
              -H "Authorization: Bearer ${API_TOKEN}" \
              -H "Accept: application/json" \
              "${API_BASE}/deployments/${du}")"
            status="$(printf '%s' "${body}" | python3 -c "import sys, json; print(json.load(sys.stdin).get('status','unknown'))")"
            echo "[$(date -u +%H:%M:%SZ)] deployment status: ${status}" >&2
            case "${status}" in
              finished|success)
                echo "Deployment finished." >&2
                exit 0
                ;;
              failed|cancelled|error)
                echo "::error::Deployment ended in status '${status}'. Tail of logs:" >&2
                printf '%s' "${body}" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          logs = d.get('logs','') or ''
          try:
              parsed = json.loads(logs)
              if isinstance(parsed, list):
                  tail = '\n'.join((e.get('output') or '').replace('\\n','\n') for e in parsed[-25:])
                  print(tail, file=sys.stderr)
              else:
                  print(logs[-3000:], file=sys.stderr)
          except Exception:
              print(logs[-3000:], file=sys.stderr)
          "
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done
          echo "::error::Timed out waiting for deployment ${du} (last status: ${status})" >&2
          exit 1
